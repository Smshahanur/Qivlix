<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg3)" />

  <!-- Neon Pylons -->
  <!-- Pipe 1 -->
  <rect x="70" y="0" width="46" height="80" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow3)" />
  <rect x="70" y="190" width="46" height="110" rx="6" fill="#7c3aed" stroke="#c084fc" stroke-width="2" filter="url(#glow3)" />

  <!-- Pipe 2 -->
  <rect x="260" y="0" width="46" height="130" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#glow3)" />
  <rect x="260" y="240" width="46" height="60" rx="6" fill="#7c3aed" stroke="#c084fc" stroke-width="2" filter="url(#glow3)" />

  <!-- Cyber Drone -->
  <g transform="translate(170, 135)" filter="url(#glow3)">
    <!-- Drone Thruster Particles -->
    <circle cx="-16" cy="-2" r="3" fill="#22d3ee" />
    <circle cx="-24" cy="1" r="2" fill="#c084fc" />
    <circle cx="-32" cy="-1" r="1.5" fill="#38bdf8" />

    <!-- Drone Body -->
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2" />
    <!-- Visor -->
    <ellipse cx="6" cy="-2" rx="7" ry="4" fill="#f0f9ff" />
    <!-- Wings -->
    <rect x="-8" y="-12" width="10" height="3" fill="#a855f7" />
    <rect x="-8" y="9" width="10" height="3" fill="#a855f7" />
  </g>

  <!-- Title Badge -->
  <rect x="100" y="245" width="200" height="32" rx="8" fill="#030712" stroke="#22d3ee" stroke-width="1.5" />
  <text x="200" y="266" fill="#22d3ee" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">CYBER FLAP</text>
</svg>
