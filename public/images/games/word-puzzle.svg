<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Word Puzzle Midnight Arcade Artwork">
  <defs>
    <linearGradient id="wp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#0d1324"/>
    </linearGradient>
    <pattern id="wp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151e34" stroke-width="1"/>
    </pattern>
    <filter id="wp-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#wp-bg)"/>
  <rect width="800" height="500" fill="url(#wp-grid)"/>
  <path d="M24 44 V24 H44 M756 24 H776 V44 M24 456 V476 H44 M756 476 H776 V456" fill="none" stroke="#ccff00" stroke-width="2" opacity="0.55"/>

  <!-- Row 1: S P A R K -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="900" text-anchor="middle">
    <rect x="175" y="78" width="76" height="76" rx="10" fill="#0f1629" stroke="#1b243b" stroke-width="2"/>
    <text x="213" y="128" fill="#64748b">S</text>

    <rect x="267" y="78" width="76" height="76" rx="10" fill="#ff5500" fill-opacity="0.2" stroke="#ff5500" stroke-width="2.5"/>
    <text x="305" y="128" fill="#ff6600">P</text>

    <rect x="359" y="78" width="76" height="76" rx="10" fill="#0f1629" stroke="#1b243b" stroke-width="2"/>
    <text x="397" y="128" fill="#64748b">A</text>

    <rect x="451" y="78" width="76" height="76" rx="10" fill="#ccff00" fill-opacity="0.16" stroke="#ccff00" stroke-width="2.5"/>
    <text x="489" y="128" fill="#ccff00">R</text>

    <rect x="543" y="78" width="76" height="76" rx="10" fill="#0f1629" stroke="#1b243b" stroke-width="2"/>
    <text x="581" y="128" fill="#64748b">K</text>
  </g>

  <!-- Row 2: P U L S E -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="900" text-anchor="middle">
    <rect x="175" y="172" width="76" height="76" rx="10" fill="#ccff00" fill-opacity="0.16" stroke="#ccff00" stroke-width="2.5"/>
    <text x="213" y="222" fill="#ccff00">P</text>

    <rect x="267" y="172" width="76" height="76" rx="10" fill="#0f1629" stroke="#1b243b" stroke-width="2"/>
    <text x="305" y="222" fill="#64748b">U</text>

    <rect x="359" y="172" width="76" height="76" rx="10" fill="#ff5500" fill-opacity="0.2" stroke="#ff5500" stroke-width="2.5"/>
    <text x="397" y="222" fill="#ff6600">L</text>

    <rect x="451" y="172" width="76" height="76" rx="10" fill="#0f1629" stroke="#1b243b" stroke-width="2"/>
    <text x="489" y="222" fill="#64748b">S</text>

    <rect x="543" y="172" width="76" height="76" rx="10" fill="#ccff00" fill-opacity="0.16" stroke="#ccff00" stroke-width="2.5"/>
    <text x="581" y="222" fill="#ccff00">E</text>
  </g>

  <!-- Row 3 (Solved!): Q I V L X -->
  <g filter="url(#wp-glow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" font-weight="900" text-anchor="middle">
    <rect x="175" y="268" width="76" height="76" rx="10" fill="#ccff00"/>
    <text x="213" y="319" fill="#060810">Q</text>

    <rect x="267" y="268" width="76" height="76" rx="10" fill="#ccff00"/>
    <text x="305" y="319" fill="#060810">I</text>

    <rect x="359" y="268" width="76" height="76" rx="10" fill="#ccff00"/>
    <text x="397" y="319" fill="#060810">V</text>

    <rect x="451" y="268" width="76" height="76" rx="10" fill="#ccff00"/>
    <text x="489" y="319" fill="#060810">L</text>

    <rect x="543" y="268" width="76" height="76" rx="10" fill="#ff5500"/>
    <text x="581" y="319" fill="#fbfaf6">X</text>
  </g>

  <text x="400" y="446" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">CYBER WORDLE // 5-LETTER CIPHER</text>
</svg>
