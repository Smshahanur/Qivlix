    <rect x="402" y="220" width="76" height="56" rx="4" fill="#ccff00" fill-opacity="0.25" stroke="#ccff00" stroke-width="2"/>
    <rect x="486" y="220" width="76" height="56" rx="4" fill="#18223a"/>

    <rect x="234" y="284" width="76" height="56" rx="4" fill="#18223a"/>
