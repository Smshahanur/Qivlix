    <rect x="402" y="156" width="76" height="56" rx="4" fill="#ff5500" fill-opacity="0.25" stroke="#ff5500" stroke-width="2"/>
    <rect x="486" y="156" width="76" height="56" rx="4" fill="#141c31"/>

    <rect x="234" y="220" width="76" height="56" rx="4" fill="#141c31"/>
