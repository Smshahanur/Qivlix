<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Neon Breakout Midnight Arcade Artwork">
  <defs>
    <linearGradient id="nb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#0d1324"/>
    </linearGradient>
    <pattern id="nb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151e34" stroke-width="1"/>
    </pattern>
    <filter id="nb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#nb-bg)"/>
  <rect width="800" height="500" fill="url(#nb-grid)"/>
  <path d="M24 44 V24 H44 M756 24 H776 V44 M24 456 V476 H44 M756 476 H776 V456" fill="none" stroke="#ccff00" stroke-width="2" opacity="0.55"/>

  <!-- Top Prism Brick Rows -->
  <g>
    <!-- Row 1: Vivid Orange -->
    <rect x="92" y="72" width="114" height="28" rx="5" fill="#ff5500"/>
    <rect x="218" y="72" width="114" height="28" rx="5" fill="#ff5500"/>
    <rect x="344" y="72" width="114" height="28" rx="5" fill="#ff5500"/>
    <rect x="470" y="72" width="114" height="28" rx="5" fill="#ff5500"/>
    <rect x="596" y="72" width="114" height="28" rx="5" fill="#ff5500"/>

    <!-- Row 2: Electric Lime (One shattered gap) -->
    <rect x="92" y="112" width="114" height="28" rx="5" fill="#ccff00"/>
    <rect x="218" y="112" width="114" height="28" rx="5" fill="#ccff00"/>
    <rect x="470" y="112" width="114" height="28" rx="5" fill="#ccff00"/>
    <rect x="596" y="112" width="114" height="28" rx="5" fill="#ccff00"/>

    <!-- Row 3: Reinforced Slate + Warm White -->
    <rect x="92" y="152" width="114" height="28" rx="5" fill="#1e293b" stroke="#fbfaf6" stroke-width="2"/>
    <rect x="218" y="152" width="114" height="28" rx="5" fill="#1e293b" stroke="#a3e635" stroke-width="2"/>
    <rect x="470" y="152" width="114" height="28" rx="5" fill="#1e293b" stroke="#ff6600" stroke-width="2"/>
    <rect x="596" y="152" width="114" height="28" rx="5" fill="#1e293b" stroke="#fbfaf6" stroke-width="2"/>
  </g>

  <!-- Shatter Particles in Gap -->
  <g fill="#ccff00" filter="url(#nb-glow)">
    <rect x="372" y="114" width="10" height="10" rx="2" transform="rotate(20 377 119)"/>
    <rect x="412" y="132" width="8" height="8" rx="2" transform="rotate(-15 416 136)"/>
    <rect x="394" y="158" width="10" height="10" rx="2" transform="rotate(35 399 163)"/>
  </g>

  <!-- Ball Deflection Trajectory -->
  <polyline points="400,360 520,250 400,148" fill="none" stroke="#fbfaf6" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.65"/>

  <!-- High-Energy Photonic Orb -->
  <g filter="url(#nb-glow)">
    <circle cx="520" cy="250" r="24" fill="#ccff00" opacity="0.22"/>
    <circle cx="520" cy="250" r="13" fill="#ccff00"/>
    <circle cx="516" cy="246" r="4" fill="#fbfaf6"/>
  </g>

  <!-- Twin Laser Beams -->
  <line x1="340" y1="358" x2="340" y2="194" stroke="#ff5500" stroke-width="3" stroke-dasharray="14 10" opacity="0.75"/>
  <line x1="460" y1="358" x2="460" y2="194" stroke="#ff5500" stroke-width="3" stroke-dasharray="14 10" opacity="0.75"/>

  <!-- Deflector Paddle -->
  <g filter="url(#nb-glow)">
    <rect x="310" y="362" width="180" height="22" rx="11" fill="#0a0e1a" stroke="#ccff00" stroke-width="3"/>
    <rect x="348" y="368" width="104" height="10" rx="5" fill="#ccff00"/>
    <circle cx="326" cy="373" r="5" fill="#ff5500"/>
    <circle cx="474" cy="373" r="5" fill="#ff5500"/>
  </g>

  <text x="400" y="446" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">NEON BREAKOUT // PRISM DEFLECTOR</text>
</svg>
