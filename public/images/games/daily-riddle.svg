<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Daily Riddle Midnight Arcade Artwork">
  <defs>
    <linearGradient id="dr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#0d1324"/>
    </linearGradient>
    <pattern id="dr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#151e34" stroke-width="1"/>
    </pattern>
    <filter id="dr-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#dr-bg)"/>
  <rect width="800" height="500" fill="url(#dr-grid)"/>
  <path d="M24 44 V24 H44 M756 24 H776 V44 M24 456 V476 H44 M756 476 H776 V456" fill="none" stroke="#ccff00" stroke-width="2" opacity="0.55"/>

  <!-- Geometric Diamond Portal -->
  <polygon points="400,66 554,220 400,374 246,220" fill="#0a0e1a" stroke="#1b243b" stroke-width="3"/>
  <polygon points="400,92 528,220 400,348 272,220" fill="none" stroke="#ff5500" stroke-width="2" stroke-dasharray="10 6" opacity="0.75"/>

  <!-- Bold Geometric Question Mark -->
  <g filter="url(#dr-glow)">
    <path d="M356 176 C356 142, 444 142, 444 178 C444 206, 400 212, 400 246" fill="none" stroke="#ccff00" stroke-width="22" stroke-linecap="square"/>
    <rect x="388" y="274" width="24" height="24" rx="4" fill="#ff5500"/>
  </g>

  <!-- Orbiting Cipher Ticks -->
  <circle cx="246" cy="220" r="8" fill="#ccff00"/>
  <circle cx="554" cy="220" r="8" fill="#ff5500"/>
  <circle cx="400" cy="66" r="8" fill="#fbfaf6"/>

  <text x="400" y="446" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">DAILY RIDDLE // LATERAL CIPHER</text>
</svg>
