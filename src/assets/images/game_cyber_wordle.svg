<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060e"/>
      <stop offset="50%" stop-color="#0b1a24"/>
      <stop offset="100%" stop-color="#04060e"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg4)" />

  <!-- Letter Tiles Row 1: C Y B E R -->
  <!-- C: Green/Emerald Correct -->
  <rect x="50" y="70" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" stroke-width="2" filter="url(#glow4)" />
  <text x="76" y="106" fill="#ffffff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">C</text>

  <!-- Y: Amber Present -->
  <rect x="110" y="70" width="52" height="52" rx="10" fill="#d97706" stroke="#fbbf24" stroke-width="2" filter="url(#glow4)" />
  <text x="136" y="106" fill="#ffffff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">Y</text>

  <!-- B: Dark Absent -->
  <rect x="170" y="70" width="52" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="196" y="106" fill="#64748b" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">B</text>

  <!-- E: Green Correct -->
  <rect x="230" y="70" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" stroke-width="2" filter="url(#glow4)" />
  <text x="256" y="106" fill="#ffffff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">E</text>

  <!-- R: Green Correct -->
  <rect x="290" y="70" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" stroke-width="2" filter="url(#glow4)" />
  <text x="316" y="106" fill="#ffffff" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle">R</text>

  <!-- Row 2: Ghost Row -->
  <g stroke="#1e293b" stroke-width="2" fill="#0a0f1d" opacity="0.6">
    <rect x="50" y="132" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" opacity="0.9" />
    <rect x="110" y="132" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" opacity="0.9" />
    <rect x="170" y="132" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" opacity="0.9" />
    <rect x="230" y="132" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" opacity="0.9" />
    <rect x="290" y="132" width="52" height="52" rx="10" fill="#059669" stroke="#34d399" opacity="0.9" />
  </g>

  <!-- Title Badge -->
  <rect x="90" y="240" width="220" height="34" rx="8" fill="#030712" stroke="#34d399" stroke-width="1.5" />
  <text x="200" y="262" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">CYBER WORDLE</text>
</svg>
