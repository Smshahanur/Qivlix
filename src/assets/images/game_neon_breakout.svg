<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg2)" />

  <!-- Bricks -->
  <g filter="url(#glow2)">
    <!-- Row 1: Cyan -->
    <rect x="40" y="40" width="60" height="18" rx="4" fill="#22d3ee" />
    <rect x="110" y="40" width="60" height="18" rx="4" fill="#22d3ee" />
    <rect x="180" y="40" width="60" height="18" rx="4" fill="#22d3ee" />
    <rect x="250" y="40" width="60" height="18" rx="4" fill="#22d3ee" />
    <rect x="320" y="40" width="40" height="18" rx="4" fill="#22d3ee" />

    <!-- Row 2: Purple -->
    <rect x="40" y="66" width="60" height="18" rx="4" fill="#c084fc" />
    <rect x="110" y="66" width="60" height="18" rx="4" fill="#c084fc" />
    <rect x="250" y="66" width="60" height="18" rx="4" fill="#c084fc" />
    <rect x="320" y="66" width="40" height="18" rx="4" fill="#c084fc" />

    <!-- Row 3: Pink -->
    <rect x="40" y="92" width="60" height="18" rx="4" fill="#f472b6" />
    <rect x="180" y="92" width="60" height="18" rx="4" fill="#f472b6" />
    <rect x="250" y="92" width="60" height="18" rx="4" fill="#f472b6" />
  </g>

  <!-- Shatter particles -->
  <circle cx="180" cy="75" r="3" fill="#22d3ee" filter="url(#glow2)" />
  <circle cx="195" cy="65" r="2.5" fill="#c084fc" filter="url(#glow2)" />
  <circle cx="210" cy="80" r="3" fill="#f472b6" filter="url(#glow2)" />

  <!-- Glowing Ball -->
  <circle cx="210" cy="170" r="7" fill="#ffffff" filter="url(#glow2)" stroke="#22d3ee" stroke-width="2" />
  <!-- Ball trail -->
  <line x1="210" y1="170" x2="190" y2="135" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Neon Paddle -->
  <rect x="150" y="225" width="100" height="12" rx="6" fill="#38bdf8" filter="url(#glow2)" stroke="#c084fc" stroke-width="1.5" />

  <!-- Title Badge -->
  <rect x="90" y="255" width="220" height="32" rx="8" fill="#030712" stroke="#c084fc" stroke-width="1.5" />
  <text x="200" y="276" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">NEON BREAKOUT</text>
</svg>
