<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)" />

  <!-- Grid Cells -->
  <g stroke="#1e293b" stroke-width="2" fill="#0f172a" opacity="0.9">
    <rect x="50" y="40" width="55" height="55" rx="8" />
    <rect x="115" y="40" width="55" height="55" rx="8" fill="#1e293b" />
    <rect x="180" y="40" width="55" height="55" rx="8" />
    <rect x="245" y="40" width="55" height="55" rx="8" />
    <rect x="310" y="40" width="55" height="55" rx="8" />

    <rect x="50" y="105" width="55" height="55" rx="8" fill="#1e293b" />
    <rect x="115" y="105" width="55" height="55" rx="8" fill="#1e1e38" stroke="#38bdf8" />
    <rect x="180" y="105" width="55" height="55" rx="8" fill="#1e293b" />
    <rect x="245" y="105" width="55" height="55" rx="8" fill="#3b0764" stroke="#c084fc" />
    <rect x="310" y="105" width="55" height="55" rx="8" />

    <rect x="50" y="170" width="55" height="55" rx="8" />
    <rect x="115" y="170" width="55" height="55" rx="8" />
    <rect x="180" y="170" width="55" height="55" rx="8" fill="#450a0a" stroke="#f43f5e" />
    <rect x="245" y="170" width="55" height="55" rx="8" />
    <rect x="310" y="170" width="55" height="55" rx="8" />
  </g>

  <!-- Cell Icons & Numbers -->
  <!-- 1 in cyan -->
  <text x="142" y="142" fill="#22d3ee" font-family="monospace" font-size="28" font-weight="900" text-anchor="middle" filter="url(#glow)">1</text>
  <!-- Flag in purple -->
  <polygon points="265,120 285,130 265,140" fill="#f43f5e" filter="url(#glow)" />
  <line x1="265" y1="120" x2="265" y2="148" stroke="#cbd5e1" stroke-width="3" />
  <!-- Bomb in rose -->
  <circle cx="207" cy="197" r="14" fill="#f43f5e" filter="url(#glow)" />
  <line x1="207" y1="183" x2="216" y2="174" stroke="#facc15" stroke-width="3" />
  <circle cx="218" cy="172" r="3" fill="#facc15" filter="url(#glow)" />

  <!-- Title Badge -->
  <rect x="80" y="240" width="240" height="36" rx="10" fill="#030712" stroke="#22d3ee" stroke-width="1.5" />
  <text x="200" y="264" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">CYBER SWEEPER</text>
</svg>
