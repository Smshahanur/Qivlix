<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="280" fill="url(#centerGlow)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Central Hexagon / Gaming Insignia -->
  <polygon points="400,160 520,230 520,370 400,440 280,370 280,230" fill="#0d1424" stroke="url(#cyanPurple)" stroke-width="4" />
  <polygon points="400,185 495,240 495,355 400,410 305,355 305,240" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" stroke-dasharray="8,4" />

  <!-- Gamepad / Energy Core Icon -->
  <path d="M350,290 C340,290 330,300 330,315 C330,335 345,355 365,355 C375,355 385,345 390,335 L410,335 C415,345 425,355 435,355 C455,355 470,335 470,315 C470,300 460,290 450,290 L350,290 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="3" />
  
  <!-- D-Pad and Buttons -->
  <rect x="345" y="305" width="20" height="6" fill="#06b6d4" rx="2" />
  <rect x="352" y="298" width="6" height="20" fill="#06b6d4" rx="2" />
  <circle cx="440" cy="305" r="4" fill="#a855f7" />
  <circle cx="452" cy="315" r="4" fill="#22d3ee" />

  <!-- Neon Brand Label -->
  <text x="400" y="490" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="6">QIVLIX</text>
  <text x="400" y="520" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#06b6d4" letter-spacing="2">PLAY BEYOND LIMITS</text>
</svg>
